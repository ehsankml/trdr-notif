name: XAUUSD Price Check

on:
  schedule:
    - cron: '*/5 * * * *'   # هر ۵ دقیقه
  workflow_dispatch:          # اجرای دستی

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check price & notify
        env:
          BOT_TOKEN: ${{ secrets.TRDR_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.TRDR_OWNER_ID }}
        run: node trdr/check.mjs

      - name: Commit state if changed
        run: |
          git config user.name "trdr-bot"
          git config user.email "trdr-bot@users.noreply.github.com"
          git diff --quiet trdr/last_price.json trdr/alarms.json || (git add trdr/last_price.json trdr/alarms.json && git commit -m "trdr: update state [skip ci]" && git push)
